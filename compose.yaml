services:
  traefik:
    image: traefik:v3.7.13
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=leafsense_internal
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD .* 0A' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  analysis:
    build:
      context: ./services/analysis-service
    environment:
      MODEL_PATH: /models/pest-cnn.onnx
      LABELS_PATH: /models/labels.json
      MODEL_INPUT_WIDTH: ${MODEL_INPUT_WIDTH:-}
      MODEL_INPUT_HEIGHT: ${MODEL_INPUT_HEIGHT:-}
      MODEL_IMAGE_MEAN: ${MODEL_IMAGE_MEAN:-0,0,0}
      MODEL_IMAGE_STD: ${MODEL_IMAGE_STD:-1,1,1}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      MODEL_TOP_K: ${MODEL_TOP_K:-3}
      MODEL_OUTPUT_ACTIVATION: ${MODEL_OUTPUT_ACTIVATION:-probabilities}
    volumes:
      - ./model_artifacts:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - internal
    restart: unless-stopped

  users:
    build:
      context: ./services/users-service
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: users_app
      DB_PASSWORD: ${USERS_DB_PASSWORD:?Set USERS_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      INTERNAL_SERVICE_TOKEN_PATH: /run/secrets/internal_service_token
      JWT_ISSUER: ${JWT_ISSUER:-leafsense-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-leafsense-api}
    secrets:
      - jwt_public_key
      - internal_service_token
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=leafsense_internal
      - traefik.http.routers.users.rule=PathPrefix(`/users`)
      - traefik.http.routers.users.entrypoints=websecure
      - traefik.http.routers.users.tls=true
      - traefik.http.services.users.loadbalancer.server.port=8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  auth:
    build:
      context: ./services/auth-service
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: auth_app
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      INTERNAL_SERVICE_TOKEN_PATH: /run/secrets/internal_service_token
      JWT_ISSUER: ${JWT_ISSUER:-leafsense-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-leafsense-api}
      JWT_KEY_ID: ${JWT_KEY_ID:-leafsense-key-1}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      USERS_SERVICE_URL: http://users:8000
    secrets:
      - jwt_private_key
      - jwt_public_key
      - internal_service_token
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=leafsense_internal
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`) || Path(`/jwks.json`)"
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls=true
      - traefik.http.services.auth.loadbalancer.server.port=8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internal
    restart: unless-stopped

  rag:
    build:
      context: ./services/rag-service
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rag_db
      DB_USER: rag_app
      DB_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-leafsense_documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      HF_HOME: /model-cache
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-10485760}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      ANALYSIS_SERVICE_URL: http://analysis:8000
      DIAGNOSIS_CONFIDENCE_THRESHOLD: ${DIAGNOSIS_CONFIDENCE_THRESHOLD:-0.60}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:-leafsense-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-leafsense-api}
    secrets:
      - jwt_public_key
    volumes:
      - model_cache:/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      analysis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=leafsense_internal
      - traefik.http.routers.rag.rule=PathPrefix(`/rag`)
      - traefik.http.routers.rag.entrypoints=websecure
      - traefik.http.routers.rag.tls=true
      - traefik.http.services.rag.loadbalancer.server.port=8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - internal
      - egress
    restart: unless-stopped

  rag-worker:
    build:
      context: ./services/rag-service
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "-m", "app.worker"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rag_db
      DB_USER: rag_app
      DB_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-leafsense_documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      HF_HOME: /model-cache
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
    volumes:
      - model_cache:/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rag:
        condition: service_healthy
    networks:
      - internal
      - egress
    restart: unless-stopped

networks:
  public:
    name: leafsense_public
  internal:
    name: leafsense_internal
    internal: true
  egress:
    name: leafsense_egress

volumes:
  pgdata:
  qdrant_data:
  model_cache:

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
  internal_service_token:
    file: ./secrets/internal_service_token
